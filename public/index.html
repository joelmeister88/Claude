<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Poker Night</title>
<style>
:root{--bg:#f3efe6;--fg:#1d1d1b;--pn:#fff;--bd:#0003;--turn:#ffd9d4;--turnbd:#e0574b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--fg:#eee;--pn:#1c2420;--bd:#fff3;--turn:#4d2320;--turnbd:#e0574b}}
:root[data-theme="dark"]{--bg:#101613;--fg:#eee;--pn:#1c2420;--bd:#fff3;--turn:#4d2320;--turnbd:#e0574b}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;padding:8px;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
button,input{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:8px 12px;background:var(--pn);color:var(--fg);touch-action:manipulation}
button{cursor:pointer;font-weight:600;min-height:44px}input{width:90px;font-size:16px;min-height:44px}
.p{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px}
.p.turn{background:var(--turn);border-color:var(--turnbd)}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tbl{--cw:min(11vw,58px);position:relative;width:100%;aspect-ratio:4/5;max-height:62vh;margin:8px auto 0;background:radial-gradient(#1b8f50,#0a5430);border:7px solid #5b3a1e;border-radius:50%;color:#fff}
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap}
.info{position:absolute;left:50%;top:calc(50% + var(--cw)*.7 + 4px);transform:translateX(-50%);width:58%;text-align:center}
/* cards: rank over suit, both large; --w sets the size */
.c{--w:34px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;width:var(--w);height:calc(var(--w)*1.4);margin:1px;border-radius:calc(var(--w)*.13);background:#fff;color:#111;font:700 calc(var(--w)*.46)/1 system-ui;font-style:normal;box-shadow:0 1px 3px #0008}
.c b{font-weight:800;letter-spacing:-.04em}.c span{font-size:1.05em;margin-top:.04em}
.c.red{color:#c0262d}.c.b{background:repeating-linear-gradient(45deg,#1e4f9c,#1e4f9c 4px,#2b66c4 4px,#2b66c4 8px);border:2px solid #fff}
.c.e{background:#0003;box-shadow:none;border:1px dashed #fff6}
.c.bd{--w:var(--cw)}.c.lg{--w:64px}.c.sm{--w:19px;margin:0}
.st{position:absolute;transform:translate(-50%,-50%);width:66px;text-align:center;font-size:11px;background:#000b;border-radius:10px;padding:3px 2px;line-height:1.2;z-index:1}
.st b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.t{box-shadow:0 0 0 3px gold}.st.f{opacity:.45}.st.t{z-index:2}.st.me{outline:2px solid #6cf}
.bet{font-size:11px;font-weight:700;color:#ffd54a;white-space:nowrap;line-height:14px;margin-top:2px}.bet .ch{width:10px;height:10px;border-width:2px}
.ch{display:inline-block;width:13px;height:13px;border-radius:50%;border:3px dashed #fff;background:#c0392b;vertical-align:middle;margin-right:2px}
.d{display:inline-block;background:#ffd54a;color:#000;border:1.5px solid #fff;border-radius:50%;width:17px;height:17px;font-size:11px;line-height:14px;font-weight:800;text-align:center;margin-right:2px;box-shadow:0 0 4px #000}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71;margin-left:4px;vertical-align:middle}
.game{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;font-weight:400}.game b{font-size:17px}.game.cur{border:2px solid #0b6b3a}
.lnk{background:none;border:0;padding:4px;min-height:0;opacity:.6;font-weight:400;text-decoration:underline}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}.g{background:#0b6b3a;color:#fff;border-color:#0b6b3a}.r{background:#b3261e;color:#fff;border-color:#b3261e}
.act button{flex:1 1 auto;white-space:nowrap;padding:8px 10px}.act input{flex:1 1 64px;width:64px}
.clock{font-weight:700;color:var(--turnbd)}
small,.m{opacity:.7}h4{margin:8px 0 2px}
</style></head><body>
<div class="top"><b id="gt" style="font-size:18px">🃏 Poker Night</b><span><button id="sh" data-a="share">🔗 Share</button> <button id="snd" data-a="snd">🔊</button></span></div>
<div id="conn" class="p" hidden>Connecting…</div><div id="note" class="p" hidden></div><div id="main"></div><div id="lobby"></div><div id="host"></div><div id="admin"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),SU='♠♥♦♣',RK='  23456789TJQKA';
let ws,S=null,me='',token='',hostKey='',host=false,admin=false,renaming=false,showKey=false,arm='',dbb=0,picking=false,lastPend=0,lastDeal=0,off=0,rt=0,peekT=0,snd=true,AC,lastN=-1,addAmt={},adjFor='',noteT,retry=0;
try{token=localStorage.getItem('pn_token')||'';hostKey=localStorage.getItem('pn_host')||''}catch(e){}
// the admin link is /#host=KEY: remember the key on this device, then drop it from the address bar
{const m=location.hash.match(/host=([^&]+)/);if(m){try{hostKey=decodeURIComponent(m[1])}catch(e){hostKey=m[1]}try{localStorage.setItem('pn_host',hostKey)}catch(e){}history.replaceState(null,'',location.pathname)}}
const LINK=location.origin+'/';
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function note(t){const e=$('#note');e.textContent=t;e.hidden=!t;clearTimeout(noteT);if(t)noteT=setTimeout(()=>e.hidden=true,4000)}
// replace markup only when it changed, so a click isn't lost to a node swapped out mid-tap
const put=(e,h)=>{if(e._h!==h){e._h=h;e.innerHTML=h}};
const ch=(c,x='')=>c==null?`<i class="c b ${x}"></i>`:`<i class="c ${[1,2].includes(c/13|0)?'red':''} ${x}"><b>${RK[2+c%13].replace('T','10')}</b><span>${SU[c/13|0]}</span></i>`;
const beep=(f,d=.15,t=0)=>{if(!snd)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}catch(e){}};
async function copy(t){try{await navigator.clipboard.writeText(t);return 1}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();let ok=0;try{ok=document.execCommand('copy')}catch(e){}x.remove();return ok}}
// ---------- connection ----------
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else note('Not connected, trying again…')};
const hs=(op,o={})=>send({t:'host',op,...o});
function connect(){
 ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onopen=()=>{retry=0;$('#conn').hidden=true;ws.send(JSON.stringify({t:'hello',token,hostKey}))};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t=='state'){S=m.s;off=Date.now()-m.now;if(me!==m.you.name)renaming=false;me=m.you.name;host=m.you.host;admin=m.you.admin;render()}
  // the table was reset: start this device over from scratch (an admin password stays remembered)
  else if(m.t=='reset'){try{localStorage.removeItem('pn_token')}catch(x){}location.reload()}
  else if(m.t=='token'){token=m.token;try{localStorage.setItem('pn_token',token)}catch(x){}}
  else if(m.t=='adminok'){hostKey=m.key;showKey=false;try{localStorage.setItem('pn_host',hostKey)}catch(x){}note('Admin unlocked')}
  else if(m.t=='badkey'){hostKey='';try{localStorage.removeItem('pn_host')}catch(x){}note('That admin link is not valid')}
  else if(m.t=='err')note(m.msg)};
 ws.onclose=()=>{const c=$('#conn');c.textContent='Reconnecting…';c.hidden=false;setTimeout(connect,Math.min(8000,500*2**retry++))};
}
// ---------- UI ----------
// deadlines are server-clock times; `off` maps them onto this device's clock
// while the host has paused the timers, countdowns hold still
const left=t=>Math.max(0,Math.ceil((t+off-(S&&S.paused?S.paused+off:Date.now()))/1000));
// blinds: 10 or more, in steps of 10
const snap=v=>Math.max(10,Math.round((+v||0)/10)*10);
function setBB(v){dbb=snap(v);const i=$('#dbb');if(i)i.value=dbb;const l=$('#sbl');if(l)l.textContent='Small blind '+dbb/2}
// live countdowns update text in place (no re-render), so buttons aren't swapped out under a tap
function tick(){document.querySelectorAll('[data-cd]').forEach(e=>{const s=left(+e.dataset.cd),t=s?s+'s':'';if(e.textContent!==t)e.textContent=t});
 const d=$('[data-a=deal][data-until]');if(d){const s=left(+d.dataset.until);d.disabled=s>0;const t=s?'Deal in '+s+'s':'Deal';if(d.textContent!==t)d.textContent=t}}
setInterval(tick,250);
const owed=()=>S.seats.filter(n=>n&&S.players[n].chips<=0);
function render(){const m=$('#main');
 if(!S){put(m,'<div class="p">Connecting to the table…</div>');return}
 $('#gt').textContent='🃏 '+S.gameName;
 if(!me||renaming){const on=S.online||[],k=S.known.map(n=>on.includes(n)&&n!==me?`<button disabled>${esc(n)} <small>(here)</small></button>`:`<button data-a="pick" data-v="${esc(n)}">${esc(n)}${S.players[n]?` <small>· ${S.players[n].chips}</small>`:''}</button>`).join('');
  put(m,`<div class="p">${k?`<b>Who are you?</b><div class="names">${k}</div><h4>New here?</h4>`:'<b>Your name</b>'}<small>First name and last initial, like “Joel L”</small><div class="row"><input id="nm" maxlength="12" placeholder="First name + initial" style="flex:1" autocomplete="nickname"><button class="g" data-a="name">Join</button>${renaming?'<button data-a="unrename">Cancel</button>':''}</div></div>`);
  put($('#lobby'),'');renderHost();renderAdmin();return}
 const H=S.hand,my=S.seats.indexOf(me),inH=H&&H.ps.includes(my)&&!H.fold[my],pl=S.players[me],pot=H?Object.values(H.tot).reduce((a,b)=>a+b,0):0;
 const occ=S.seats.map((n,i)=>n?i:-1).filter(i=>i>=0),N=Math.max(occ.length,1),mr=Math.max(0,occ.indexOf(my));
 let seats='';for(let r=0;r<occ.length;r++){const i=occ[r],a=(r-mr)*2*Math.PI/N,x=50-41*Math.sin(a),y=50+42*Math.cos(a),n=S.seats[i];
  const ih=H&&H.ps.includes(i),fo=ih&&H.fold[i];
  const cards=ih&&!fo?'<br>'+H.h[i].map(c=>ch(H.show?c:null,'sm')).join(''):'';
  seats+=`<div class="st ${H&&!H.done&&H.turn==i?'t':''} ${fo?'f':''} ${i==my?'me':''}" style="left:${x}%;top:${y}%"><b>${(H&&!H.done?H.btn:S.dealer)==i?'<span class="d">D</span>':''}${n===S.hostName?'<span title="Host">👑</span>':''}${esc(n)}</b>${S.players[n].chips}${cards}${ih&&H.bet[i]?`<div class="bet"><i class="ch"></i>${H.bet[i]}</div>`:''}</div>`}
 const board=H?[0,1,2,3,4].map(k=>H.board[k]!=null?ch(H.board[k],'bd'):'<i class="c e bd"></i>').join(''):'';
 const qi=(S.queue||[]).indexOf(me),full=S.seats.filter(n=>!n).length-Object.keys(S.pend).length<=0;
 const live=H&&!H.done,myDeal=!live&&my>=0&&S.dealer==my&&S.dealDl>0,dealer=S.seats[S.dealer];
 const who=`<b>${esc(me)}</b> <button data-a="rename" style="padding:2px 8px;font-size:12px">change</button>`;
 let me_='';
 if(my<0)me_=`${who} <span class="m">Saved chips: ${pl?pl.chips:0}</span><div class="row">${S.pend[me]?'<small>Seat requested, waiting for host…</small> <button data-a="unsit">Cancel</button>':qi>=0?`<b>You're #${qi+1} in line</b> <small>You'll get the next open seat.</small> <button data-a="unsit">Leave the line</button>`:full?'<button class="g" data-a="seat">Join the waitlist</button> <small>All 12 seats are taken.</small>':'<button class="g" data-a="seat">Sit Down</button>'}</div>`;
 else if(S.bust[me])me_=`<b>${esc(me)}</b> · <b>You're out of chips</b><div class="row"><button class="g" data-a="buy">Get more chips</button><button class="r" data-a="stand">Stand Up</button></div><small>Choose within <span data-cd="${S.bust[me]}"></span> or you'll stand up automatically.</small>`;
 else{me_=`<b>${esc(me)}</b> · ${pl.chips} chips`;
  if(inH){const pk=Date.now()<peekT;me_+=`<div class="row">${H.h[my].map(c=>ch(pk?c:null,'lg')).join('')}${pk?'<button data-a="hide">🙈 Hide now</button>':'<button data-a="peek">👁 Peek 3s</button>'}</div>`;
   if(!H.done&&H.turn==my){const need=H.cur-H.bet[my],mn=Math.min(H.cur+H.minR,H.bet[my]+pl.chips);if(!rt||rt<mn||rt>H.bet[my]+pl.chips)rt=mn;
    me_+=`<div class="row"><b>Your turn</b> <span class="clock" data-cd="${H.dl||0}"></span></div><div class="row act"><button class="r" data-a="fold">Fold</button><button class="g" data-a="call">${need>0?'Call '+Math.min(need,pl.chips):'Check'}</button><button data-a="allin">All-in</button></div>`;
    if(pl.chips>need)me_+=`<div class="row act"><input id="rt" type="number" inputmode="numeric" value="${rt}"><button class="g" data-a="raise">${H.cur?'Raise to':'Bet'}</button><button data-a="q" data-v="${mn}">Min</button><button data-a="q" data-v="${H.cur+Math.floor(pot/2)}">½ Pot</button><button data-a="q" data-v="${H.cur+pot}">Pot</button></div>`}
   else if(!H.done)me_+=`<div class="m">Waiting for ${esc(S.seats[H.turn])}… <span data-cd="${H.dl||0}"></span></div>`}
  else if(H&&!H.done)me_+=`<div class="m">You're sitting out this hand.</div>`;
  if(myDeal)me_+=`<div class="row"><b>You're the dealer</b> <span class="clock" data-cd="${S.dealDl}"></span></div><div class="row"><button data-a="pickgame">🎲 Change game</button><small>Now: ${esc(S.gameName)}</small></div><div class="row act"><span>Blind</span><button data-a="bbdn" aria-label="Lower blind">−</button><input id="dbb" type="number" inputmode="numeric" min="10" step="10" value="${dbb||S.bb}"><button data-a="bbup" aria-label="Raise blind">+</button></div><div class="row act"><small id="sbl" style="flex:1">Small blind ${(dbb||S.bb)/2}</small><button class="g" data-a="deal" data-until="${S.wait||0}">Deal</button></div><small>Deal within the time or the deal passes to your left.</small>`;
  me_+=`<div class="row">${S.leave[me]?'<small>Standing up when this hand ends…</small>':`<button class="r" data-a="stand">Stand Up</button>`}${S.buy[me]?'<small>Chip request sent, waiting for host…</small>':'<button data-a="buy">Get more chips</button>'}</div>`;
  if(inH&&!H.done&&!S.leave[me])me_+='<small>Standing up mid-hand folds your cards.</small>'}
 if(picking&&myDeal){put(m,`<div class="p turn"><div class="row"><b style="flex:1">Choose the game</b><span class="clock" data-cd="${S.dealDl}"></span></div><small>You're the dealer. Pick what everyone plays next.</small>${S.games.map(g=>`<button class="game ${g.id==S.game?'cur':''}" data-a="setgame" data-v="${g.id}" ${g.ready?'':'disabled'}><b>${esc(g.name)}</b>${g.id==S.game?' <small>· now playing</small>':''}<br><small>${esc(g.blurb)}</small></button>`).join('')}<div class="row"><button data-a="unpick">Back</button></div></div>`);lastN=S.n;renderLobby();renderHost();renderAdmin();tick();return}
 if(!myDeal)picking=false;
 const f=document.activeElement;
 if(!(myDeal&&f&&f.id=='dbb'))put(m,`<div class="tbl" style="aspect-ratio:${N<=3?'1/1':N<=7?'6/7':'4/5'}">${seats}<div class="mid">${board}</div><div class="info"><div style="font-size:16px"><i class="ch"></i><b>Pot ${pot}</b></div><div style="font-size:12px">${S.hold=='host'?'<b style="color:#ffd54a">⏸ Paused by the host</b><br>':S.hold=='seats'?`<b style="color:#ffd54a">⏸ Waiting for the host to seat ${esc(Object.keys(S.pend).join(', '))}</b><br>`:''}${H?esc(H.msg):''}${!live&&S.dealDl&&dealer?`<br><span class="d">D</span>${esc(dealer)} deals next <span data-cd="${S.dealDl}"></span>`:!live&&!S.dealDl?'<br>Waiting for players':''}</div></div></div><div class="p ${(live&&H.turn==my&&my>=0)||myDeal?'turn':''}">${me_}</div>`);
 if(myDeal&&lastDeal!==S.dealDl){beep(523,.12);navigator.vibrate&&navigator.vibrate(120)}lastDeal=myDeal?S.dealDl:0;
 if(H&&!H.done&&H.turn==my&&lastN!=S.n){rt=0;beep(660,.12);beep(880,.2,.15);navigator.vibrate&&navigator.vibrate(200)}
 if(H&&H.done&&lastN!=S.n&&lastN>=0){[523,659,784].forEach((f,i)=>beep(f,.15,i*.12))}
 lastN=S.n;renderLobby();renderHost();renderAdmin();tick()}
// people with chips who aren't sitting at the table
function renderLobby(){const on=S.online||[],q=S.queue||[],away=Object.keys(S.players).filter(n=>!S.players[n].bot&&!S.seats.includes(n)&&!q.includes(n)&&S.players[n].chips>0).sort();
 put($('#lobby'),`<div class="p"><small>👑 Host: <b>${esc(S.hostName||'nobody yet')}</b></small>${q.length?`<h4>Waiting list</h4>${q.map((n,k)=>`<div class="row" style="margin-top:2px"><span style="flex:1">${k+1}. ${esc(n)}${on.includes(n)?'<i class="dot" title="online"></i>':''}${n===me?' <small>(you)</small>':''}</span></div>`).join('')}`:''}${away.length?`<h4>Not at the table</h4>${away.map(n=>`<div class="row" style="margin-top:2px"><span style="flex:1">${esc(n)}${on.includes(n)?'<i class="dot" title="online"></i>':''}${S.pend[n]?' <small>(wants a seat)</small>':''}</span><b>${S.players[n].chips}</b></div>`).join('')}`:''}</div>`)}
function renderAdmin(){const e=$('#admin'),f=document.activeElement;if(f&&f.tagName=='INPUT'&&e.contains(f))return;
 if(!admin){put(e,showKey?`<div class="p"><b>Admin</b><div class="row"><input id="ak" type="password" placeholder="Password" style="flex:1" autocomplete="current-password"><button class="g" data-a="unlock">Unlock</button></div></div>`:'<div class="row" style="justify-content:center"><button class="lnk" data-a="showkey">Admin</button></div>');return}
 const names=(S.known||[]).map(n=>`<div class="row" style="margin-top:2px"><span style="flex:1">${esc(n)} ${S.players[n]?`<small>${S.players[n].chips} chips</small>`:''}</span><button data-a="forget" data-v="${esc(n)}" ${arm=='f:'+n?'class="r">Delete?':'>✕'}</button></div>`).join('');
 put(e,`<div class="p"><b>Admin</b><div class="row">${host?'<small>You are the host.</small>':'<button class="g" data-a="takeover">Become host</button>'}<button data-a="reset" ${arm=='reset'?'class="r">Tap again to erase everything':'>Reset table'}</button></div><h4>Saved names</h4>${names||'<small>None yet</small>'}</div>`)}
function renderHost(){const e=$('#host'),f=document.activeElement;if(!host)return put(e,'');if(!S||(f&&f.tagName=='INPUT'&&e.contains(f)))return;const H=S.hand;
 const pend=Object.keys(S.pend).map(n=>{const v=addAmt[n]??(S.players[n].chips>0?0:1000);return`<div class="row"><b>${esc(n)}</b><span class="m">saved ${S.players[n].chips}</span> +<input data-add="${esc(n)}" type="number" value="${esc(v)}"><button class="g" data-a="ok" data-v="${esc(n)}">Seat</button><button data-a="no" data-v="${esc(n)}">✕</button></div>`}).join('');
 const buy=Object.keys(S.buy).map(n=>{const v=addAmt[n]??1000;return`<div class="row"><b>${esc(n)}</b><span class="m">has ${S.players[n].chips}</span> +<input data-add="${esc(n)}" type="number" value="${esc(v)}"><button class="g" data-a="give" data-v="${esc(n)}">Give</button><button data-a="nobuy" data-v="${esc(n)}">✕</button></div>`}).join('');
 const bust=Object.keys(S.bust).map(n=>`<div class="row"><b>${esc(n)}</b> is out of chips, deciding… <span data-cd="${S.bust[n]}"></span></div>`).join('');
 const o=owed(),live=H&&!H.done,dn=S.seats[S.dealer],st=live?'Hand in progress':o.length?'Waiting on '+esc(o.join(', ')):dn&&S.dealDl?`Dealer: ${esc(dn)}`:'Waiting for players';
 const led=Object.keys(S.players).map(n=>{const seated=S.seats.includes(n),v=esc(n);return`<div class="row"><span style="flex:1">${v} ${seated?'':'<small>(away)</small>'}</span><b>${S.players[n].chips}</b>${adjFor==n?`<input data-adjin="${v}" type="number" placeholder="±" style="width:80px"><button class="g" data-a="adjok" data-v="${v}">OK</button>`:`<button data-a="adj" data-v="${v}">±</button>`}${S.players[n].bot?`<button data-a="rmbot" data-v="${v}">✕</button>`:seated?`<button data-a="kick" data-v="${v}" title="Stand this player up">⏏</button>`:''}</div>`}).join('');
 // someone waiting for a seat: the clocks are frozen until the host answers, so make it stand out
 const np=Object.keys(S.pend).length;if(np>lastPend){beep(880,.12);beep(660,.12,.15);navigator.vibrate&&navigator.vibrate([120,80,120])}lastPend=np;
 put(e,`<div class="p ${np?'turn':''}"><b>Host controls</b> <small>${esc(S.gameName)}</small><div class="row"><span style="flex:1">${st}</span><button data-a="pause" ${S.hold=='host'?'class="g">▶ Resume':'>⏸ Pause'}</button>${!live&&dn&&S.dealDl?`<button data-a="start" title="Deal for the dealer">Deal now</button>`:''}<button data-a="bot">+ Bot</button></div>
 ${pend?'<h4>Seat requests <small>· timers paused until you answer</small></h4>'+pend:''}${buy?'<h4>Chip requests</h4>'+buy:''}${bust?'<h4>Out of chips</h4>'+bust:''}<h4>Chip ledger</h4>${led||'<small>No players yet</small>'}</div>`);tick()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 try{AC=AC||new AudioContext();AC.resume()}catch(x){}
 if(a=='name'){const n=$('#nm').value.trim();if(n)send({t:'name',name:n})}
 else if(a=='pick')send({t:'name',name:v});
 else if(a=='rename'){renaming=true;render()}
 else if(a=='unrename'){renaming=false;render()}
 else if(a=='deal'){setBB($('#dbb').value);send({t:'deal',bb:dbb});dbb=0}
 else if(a=='pickgame'){picking=true;render()}
 else if(a=='unpick'){picking=false;render()}
 else if(a=='setgame'){send({t:'game',game:v});picking=false;render()}
 else if(a=='bbup')setBB(+$('#dbb').value+10);
 else if(a=='bbdn')setBB(+$('#dbb').value-10);
 else if(a=='showkey'){showKey=true;renderAdmin();$('#ak').focus()}
 else if(a=='unlock'){const k=$('#ak').value;if(k)send({t:'admin',key:k})}
 else if(a=='takeover')send({t:'admin',op:'takeover'});
 else if(a=='reset'){if(arm=='reset'){arm='';send({t:'admin',op:'reset'})}else{arm='reset';renderAdmin()}}
 else if(a=='forget'){if(arm=='f:'+v){arm='';send({t:'admin',op:'forget',name:v})}else{arm='f:'+v;renderAdmin()}}
 else if(a=='share'){const ok=await copy(LINK);b.textContent=ok?'✓ Copied':'Copy failed';if(!ok)note('Copy this link: '+LINK);setTimeout(()=>b.textContent='🔗 Share',1500)}
 else if(a=='snd'){snd=!snd;b.textContent=snd?'🔊':'🔈'}
 else if(a=='seat')send({t:'sit'});
 else if(a=='unsit')send({t:'unsit'});
 else if(a=='stand')send({t:'stand'});
 else if(a=='buy')send({t:'buy'});
 else if(a=='fold'||a=='call')send({t:'act',a});
 else if(a=='raise')send({t:'act',a:'raise',amt:rt});
 else if(a=='allin')send({t:'act',a:'raise',amt:1e9});
 else if(a=='q'){rt=+v;render()}
 else if(a=='peek'){peekT=Date.now()+3000;render();setTimeout(render,3050)}
 else if(a=='hide'){peekT=0;render()}
 else if(!host)return;
 else if(a=='start')hs('start');
 else if(a=='pause')hs('pause',{on:S.hold!='host'});
 else if(a=='ok'){hs('seat',{name:v,add:addAmt[v]});delete addAmt[v]}
 else if(a=='no')hs('noseat',{name:v});
 else if(a=='give'){hs('give',{name:v,add:addAmt[v]??1000});delete addAmt[v]}
 else if(a=='nobuy')hs('nobuy',{name:v});
 else if(a=='bot')hs('bot');
 else if(a=='rmbot')hs('rmbot',{name:v});
 else if(a=='kick')hs('kick',{name:v});
 else if(a=='adj'){adjFor=v;render();const i=$('[data-adjin]');i&&i.focus()}
 else if(a=='adjok'){const x=$('[data-adjin]').value;adjFor='';hs('adj',{name:v,x});render()}});
document.addEventListener('focusout',e=>{if(e.target.id=='dbb'){setBB(e.target.value);setTimeout(render,300)}});
document.addEventListener('keydown',e=>{if(e.key!='Enter')return;if(e.target.id=='nm')$('[data-a=name]').click();if(e.target.id=='ak')$('[data-a=unlock]').click()});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='rt')rt=+t.value;if(t.id=='dbb'){const l=$('#sbl');if(l)l.textContent='Small blind '+snap(t.value)/2}if(t.dataset.add)addAmt[t.dataset.add]=t.value});
render();connect();
</script></body></html>
