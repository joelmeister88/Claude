<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Poker Night</title>
<style>
:root{--bg:#fff;--fg:#1d1d1b;--pn:#f2f2f2;--bd:#0003;--turn:#ffd9d4;--turnbd:#e0574b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#eee;--pn:#161616;--bd:#fff3;--turn:#4d2320;--turnbd:#e0574b}}
:root[data-theme="dark"]{--bg:#000;--fg:#eee;--pn:#161616;--bd:#fff3;--turn:#4d2320;--turnbd:#e0574b}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;padding:8px;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
button,input{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:8px 12px;background:var(--pn);color:var(--fg);touch-action:manipulation}
button{cursor:pointer;font-weight:600;min-height:44px}input{width:90px;font-size:16px;min-height:44px}
.p{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px}
.p.turn{background:var(--turn);border-color:var(--turnbd)}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tbl{--cw:min(11vw,58px);position:relative;width:100%;aspect-ratio:4/5;max-height:62vh;margin:8px auto 0;background:radial-gradient(#1b8f50,#0a5430);border:7px solid #5b3a1e;border-radius:50%;color:#fff}
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap}
.info{position:absolute;left:50%;top:calc(50% + var(--cw)*.7 + 4px);transform:translateX(-50%);width:58%;text-align:center}
/* cards: rank over suit, both large; --w sets the size */
.c{--w:34px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;width:var(--w);height:calc(var(--w)*1.4);margin:1px;border-radius:calc(var(--w)*.13);background:#fff;color:#111;font:700 calc(var(--w)*.46)/1 system-ui;font-style:normal;box-shadow:0 1px 3px #0008}
.c b{font-weight:800;letter-spacing:-.04em}.c span{font-size:1.05em;margin-top:.04em}
.c.red{color:#c0262d}.c.b{background:repeating-linear-gradient(45deg,#1e4f9c,#1e4f9c 4px,#2b66c4 4px,#2b66c4 8px);border:2px solid #fff}
.c{position:relative}.c.w::after{content:'★';position:absolute;top:0;right:2px;font-size:.5em;color:#e0a000}
.c.xs{--w:11px;margin:0}.c.nk{--w:40px}.cb.go .c{animation:pl 1.2s ease-in-out infinite}@keyframes pl{50%{transform:translateY(-4px);box-shadow:0 0 0 3px #ffd54a}}.c.md{--w:56px}.c.rs{--w:28px}.c.sel{outline:3px solid #e0574b;transform:translateY(-8px)}
.cb{padding:0;border:0;background:none;min-height:0;display:inline-block}select{font:inherit;font-size:16px;min-height:44px;border-radius:10px;border:1px solid var(--bd);padding:8px;background:var(--pn);color:var(--fg)}
.c.e{background:#0003;box-shadow:none;border:1px dashed #fff6}
.c.bd{--w:var(--cw)}.c.lg{--w:64px}.c.sm{--w:19px;margin:0}
.st{position:absolute;transform:translate(-50%,-50%);width:66px;text-align:center;font-size:11px;background:#000b;border-radius:10px;padding:3px 2px;line-height:1.2;z-index:1}
.st b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.t{box-shadow:0 0 0 3px gold}.st.f{opacity:.45}.st.t{z-index:2}.st.me{outline:2px solid #6cf}
.bet{font-size:11px;font-weight:700;color:#ffd54a;white-space:nowrap;line-height:14px;margin-top:2px}.bet .ch{width:10px;height:10px;border-width:2px}
.ch{display:inline-block;width:13px;height:13px;border-radius:50%;border:3px dashed #fff;background:#c0392b;vertical-align:middle;margin-right:2px}
.d{display:inline-block;background:#ffd54a;color:#000;border:1.5px solid #fff;border-radius:50%;width:17px;height:17px;font-size:11px;line-height:14px;font-weight:800;text-align:center;margin-right:2px;box-shadow:0 0 4px #000}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71;margin-left:4px;vertical-align:middle}
.game{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;font-weight:400}.game b{font-size:17px}.game.cur{border:2px solid #0b6b3a}
.coin{display:inline-block;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#e0a800 60%,#a87400);border:1px solid #7a5600;margin:0 1px;vertical-align:middle}.coin.x{opacity:.25;filter:grayscale(1)}.lv{line-height:12px;margin-top:2px}.lv.big .coin{width:18px;height:18px;margin:0 2px}
.deck{position:relative;display:inline-block}.deck b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000c;color:#fff;border-radius:10px;padding:1px 7px;font-size:14px}
.note-ok{margin-top:6px;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
.trades{margin-top:6px;padding:6px 8px;border-radius:8px;background:#0000000d;font-size:14px;line-height:1.4}
.st.lo{box-shadow:0 0 0 3px #e0574b}
#rules{position:fixed;inset:0;z-index:9;background:var(--bg);overflow:auto;padding:12px max(12px,calc(50% - 270px));padding-top:max(12px,env(safe-area-inset-top))}#rules h3{margin:14px 0 4px}#rules li{margin:4px 0;line-height:1.35}#rules ul{padding-left:20px;margin:4px 0}
.lnk{background:none;border:0;padding:4px;min-height:0;opacity:.6;font-weight:400;text-decoration:underline}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}.g{background:#0b6b3a;color:#fff;border-color:#0b6b3a}.r{background:#b3261e;color:#fff;border-color:#b3261e}
.full>*{flex:1 1 0}
.act button{flex:1 1 auto;white-space:nowrap;padding:8px 10px}.act input{flex:1 1 64px;width:64px}
.clock{font-weight:700;color:var(--turnbd)}
small,.m{opacity:.7}h4{margin:8px 0 2px}
</style></head><body>
<div class="top"><b id="gt" style="font-size:18px">🃏 Poker Night</b><span><button data-a="rules" aria-label="Rules">📖</button> <button id="sh" data-a="share">🔗 Share</button> <button id="th" data-a="th" aria-label="Light or dark">🌙</button> <button id="snd" data-a="snd" aria-label="Sound and vibration">🔊</button></span></div>
<div id="conn" class="p" hidden>Connecting…</div><div id="note" class="p" hidden></div><div id="main"></div><div id="lobby"></div><div id="host"></div><div id="admin"></div><div id="rules" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s),SU='♠♥♦♣',RK='  23456789TJQKA';
let ws,S=null,me='',token='',hostKey='',host=false,admin=false,renaming=false,showKey=false,arm='',dealStep=0,dbb=0,dan=0,bta=0,rtMin=0,rtMax=0,rtStep=10,picking=false,lastPend=0,lastDeal=0,off=0,rt=0,peekT=0,snd='all',theme='',AC,lastN=-1,lastTurn='',curHid=0,doneFired=1,dsel=[],dselKey='',dwl=-2,wildR=[],addAmt={},adjFor='',noteT,retry=0;
try{token=localStorage.getItem('pn_token')||'';hostKey=localStorage.getItem('pn_host')||'';snd=localStorage.getItem('pn_snd')||'all';theme=localStorage.getItem('pn_theme')||''}catch(e){}
// the admin link is /#host=KEY: remember the key on this device, then drop it from the address bar
{const m=location.hash.match(/host=([^&]+)/);if(m){try{hostKey=decodeURIComponent(m[1])}catch(e){hostKey=m[1]}try{localStorage.setItem('pn_host',hostKey)}catch(e){}history.replaceState(null,'',location.pathname)}}
const LINK=location.origin+'/';
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function note(t){const e=$('#note');e.textContent=t;e.hidden=!t;clearTimeout(noteT);if(t)noteT=setTimeout(()=>e.hidden=true,4000)}
// replace markup only when it changed, so a click isn't lost to a node swapped out mid-tap
const put=(e,h)=>{if(e._h!==h){e._h=h;e.innerHTML=h}};
const ch=(c,x='')=>c==null?`<i class="c b ${x}"></i>`:`<i class="c ${[1,2].includes(c/13|0)?'red':''} ${wildR.includes(c%13)?'w':''} ${x}"><b>${RK[2+c%13].replace('T','10')}</b><span>${SU[c/13|0]}</span></i>`;
const sndOn=()=>snd=='all',vibOn=()=>snd!='off';
const beep=(f,d=.15,t=0)=>{if(!sndOn())return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}catch(e){}};
// alert sounds: the three clips load once, then play through Web Audio (works after the first tap on the page)
const SND={},RAW={};
async function loadSounds(){for(const k of ['turn','win','yourdeal'])try{const r=await fetch('/sounds/'+k+'.mp3');if(r.ok)RAW[k]=await r.arrayBuffer()}catch(e){}await decodeAll()}
async function decodeAll(){if(!AC)return;for(const k in RAW)if(!SND[k])try{SND[k]=await AC.decodeAudioData(RAW[k].slice(0))}catch(e){}}
function play(k,fb){if(!sndOn())return;try{AC=AC||new AudioContext();AC.resume&&AC.resume();const b=SND[k];if(b){const x=AC.createBufferSource();x.buffer=b;x.connect(AC.destination);x.start();return}}catch(e){}fb&&fb()}
const buzz=p=>{if(vibOn()&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
const isDark=()=>(theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))=='dark';
function skin(){if(theme)document.documentElement.dataset.theme=theme;const t=$('#th');if(t)t.textContent=isDark()?'☀️':'🌙';const b=$('#snd');if(b)b.textContent=snd=='all'?'🔊':snd=='vib'?'📳':'🔇'}
const ANTE=['syn','bts','draw','nopeek'];
const WN=w=>RK[2+w].replace('T','10');
async function copy(t){try{await navigator.clipboard.writeText(t);return 1}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();let ok=0;try{ok=document.execCommand('copy')}catch(e){}x.remove();return ok}}
// ---------- connection ----------
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else note('Not connected, trying again…')};
const hs=(op,o={})=>send({t:'host',op,...o});
function connect(){
 ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onopen=()=>{retry=0;$('#conn').hidden=true;ws.send(JSON.stringify({t:'hello',token,hostKey}))};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t=='state'){S=m.s;off=Date.now()-m.now;if(me!==m.you.name)renaming=false;me=m.you.name;host=m.you.host;admin=m.you.admin;render()}
  // the table was reset: start this device over from scratch (an admin password stays remembered)
  else if(m.t=='reset'){try{localStorage.removeItem('pn_token')}catch(x){}location.reload()}
  else if(m.t=='token'){token=m.token;try{localStorage.setItem('pn_token',token)}catch(x){}}
  else if(m.t=='adminok'){hostKey=m.key;showKey=false;try{localStorage.setItem('pn_host',hostKey)}catch(x){}note('Admin unlocked')}
  else if(m.t=='badkey'){hostKey='';try{localStorage.removeItem('pn_host')}catch(x){}note('That admin link is not valid')}
  else if(m.t=='err')note(m.msg)};
 ws.onclose=()=>{const c=$('#conn');c.textContent='Reconnecting…';c.hidden=false;setTimeout(connect,Math.min(8000,500*2**retry++))};
}
// ---------- UI ----------
// deadlines are server-clock times; `off` maps them onto this device's clock
// while the host has paused the timers, countdowns hold still
const left=t=>Math.max(0,Math.ceil((t+off-(S&&S.paused?S.paused+off:Date.now()))/1000));
// blinds: 10 or more, in steps of 10
const snap=v=>Math.max(10,Math.round((+v||0)/10)*10);
// a card named inline in text, e.g. K♥
const cn=c=>`<b style="color:${[1,2].includes(c/13|0)?'#c0262d':'inherit'}">${RK[2+c%13].replace('T','10')}${SU[c/13|0]}</b>`;
// Screw Your Neighbor: what you traded this round (only you and your trade partner see these)
const tradeText=x=>x.k=='gave'?`You gave ${esc(x.to)} your ${cn(x.gave)} and got ${cn(x.got)}.`:x.k=='took'?`${esc(x.from)} gave you ${cn(x.got)} and took your ${cn(x.gave)}.`:x.k=='deck'?`You swapped your ${cn(x.gave)} with the deck and got ${cn(x.got)}.`:x.k=='blocked'?`${esc(x.to)} had an Ace, so your swap was refused.`:`${esc(x.from)} tried to take your Ace. You kept it.`;
const coins=n=>'<i class="coin"></i>'.repeat(Math.max(0,n))+'<i class="coin x"></i>'.repeat(Math.max(0,4-n));
// Between the Sheets bets: 100 or more, in steps of 100, up to the pot
function setBet(v,pot){bta=Math.min(pot,Math.max(100,Math.round((+v||0)/100)*100));const i=$('#bta');if(i)i.value=bta}
function setAnte(v){dan=Math.max(100,Math.round((+v||0)/100)*100);const i=$('#dan');if(i)i.value=dan}
// Hold'em raises: steps of the big blind, at least one big blind more, all-in is the cap
const rtSnap=v=>{v=Math.max(rtMin,Math.floor((+v||0)/rtStep)*rtStep);return v>=rtMax?rtMax:v};
function setBB(v){dbb=snap(v);const i=$('#dbb');if(i)i.value=dbb;const l=$('#sbl');if(l)l.textContent='Small blind '+dbb/2}
// live countdowns update text in place (no re-render), so buttons aren't swapped out under a tap
function tick(){document.querySelectorAll('[data-cd]').forEach(e=>{const s=left(+e.dataset.cd),t=s?s+'s':'';if(e.textContent!==t)e.textContent=t});
 const d=$('[data-a=deal][data-until]');if(d){const s=left(+d.dataset.until);d.disabled=s>0;const t=s?'Deal in '+s+'s':'Deal';if(d.textContent!==t)d.textContent=t}}
setInterval(tick,250);
const owed=()=>S.seats.filter(n=>n&&S.players[n].chips<=0);
function render(){const m=$('#main');
 if(!S){put(m,'<div class="p">Connecting to the table…</div>');return}
 $('#gt').textContent='🃏 '+S.gameName;
 if(!me||renaming){const on=S.online||[],k=S.known.map(n=>on.includes(n)&&n!==me?`<button disabled>${esc(n)} <small>(here)</small></button>`:`<button data-a="pick" data-v="${esc(n)}">${esc(n)}${S.players[n]?` <small>· ${S.players[n].chips}</small>`:''}</button>`).join('');
  put(m,`<div class="p">${k?`<b>Who are you?</b><div class="names">${k}</div><h4>New here?</h4>`:'<b>Your name</b>'}<small>First name and last initial, like “Joel L”</small><div class="row"><input id="nm" maxlength="12" placeholder="First name + initial" style="flex:1" autocomplete="nickname"><button class="g" data-a="name">Join</button>${renaming?'<button data-a="unrename">Cancel</button>':''}</div>${renaming&&S.seats.includes(me)?'<small>Switching names stands '+esc(me)+' up from the table; chips stay saved under that name.</small>':''}</div>`);
  put($('#lobby'),'');renderHost();renderAdmin();return}
 const H=S.hand,isSyn=H&&H.g=='syn',isBts=H&&H.g=='bts',isDraw=H&&H.g=='draw',isNP=H&&H.g=='nopeek';wildR=isDraw&&H.wild>=0?[H.wild]:isNP?[0,2,8]:[];const my=S.seats.indexOf(me),inH=H&&!isSyn&&!isBts&&H.ps.includes(my)&&!H.fold[my],inG=isSyn&&H.ps.includes(my),inB=isBts&&H.ps.includes(my)&&!H.out[my],pl=S.players[me],pot=!H?0:isSyn||isBts?H.pot:Object.values(H.tot).reduce((a,b)=>a+b,0);
 const occ=S.seats.map((n,i)=>n?i:-1).filter(i=>i>=0),N=Math.max(occ.length,1),mr=Math.max(0,occ.indexOf(my));
 let seats='';for(let r=0;r<occ.length;r++){const i=occ[r],a=(r-mr)*2*Math.PI/N,x=50-41*Math.sin(a),y=50+42*Math.cos(a),n=S.seats[i];
  const so=S.sitout&&S.sitout[n]&&!(H&&!H.done&&H.ps.includes(i)),ih=H&&H.ps.includes(i),fo=ih&&(isSyn?!(H.lives[i]>0):isBts?H.out[i]:H.fold[i]),lo=isSyn&&H.stage=='reveal'&&H.low.includes(i);
  const cards=!ih||isBts?'':isSyn?(i in H.cards?'<br>'+ch(i==my&&!H.shown[i]&&H.stage!='reveal'?null:H.cards[i],'sm'):'')+`<div class="lv">${coins(H.lives[i])}</div>`:!fo&&!isNP?'<br>'+H.h[i].map(c=>ch(H.show?c:null,isDraw?'xs':'sm')).join(''):'';
  seats+=`<div class="st ${H&&!H.done&&H.turn==i?'t':''} ${fo||so?'f':''} ${lo?'lo':''} ${i==my?'me':''}" style="left:${x}%;top:${y}%"><b>${(H&&!H.done?H.btn:S.dealer)==i?'<span class="d">D</span>':''}${n===S.hostName?'<span title="Host">👑</span>':''}${esc(n)}</b>${S.players[n].chips}${cards}${so?'<div class="bet" style="color:#ddd">sitting out</div>':''}${ih&&!isSyn&&!isBts&&H.bet[i]?`<div class="bet"><i class="ch"></i>${H.bet[i]}</div>`:''}</div>`}
 const res=isBts&&H.res,ring=res=='win'?'box-shadow:0 0 0 3px #2ecc71':res=='post'?'box-shadow:0 0 0 3px #e0574b':'';
 const board=isBts?(H.done&&!H.show?'':`${H.done?'':`<span class="deck"><i class="c b bd"></i><b>${H.deckN}</b></span> &nbsp;`}${ch(H.cards.lo,'bd')}${H.cards.mid!=null?ch(H.cards.mid,'bd').replace('<i ',`<i style="${ring}" `):'<i class="c e bd"></i>'}${ch(H.cards.hi,'bd')}`):isSyn?(H.done?'':`<span class="deck"><i class="c b bd"></i><b>${H.deckN}</b></span>`):isNP?`<div style="font-size:13px;line-height:1.4;text-align:center">${ch(H.top,'bd')}<br>Card to beat${[0,2,8].includes(H.top%13)?' (wild = Ace)':''}<br>Wild: <b>2s 4s 10s</b> ★</div>`:isDraw?`<div style="font-size:14px;line-height:1.5">${H.wild>=0?'Wild: <b>'+WN(H.wild)+'s</b> ★':'No wild cards'}<br>${H.stage==0?'Betting':H.stage==1?'Drawing':'Final betting'}</div>`:H?[0,1,2,3,4].map(k=>H.board[k]!=null?ch(H.board[k],'bd'):'<i class="c e bd"></i>').join(''):'';
 const qi=(S.queue||[]).indexOf(me),full=S.seats.filter(n=>!n).length-Object.keys(S.pend).length<=0;
 const live=H&&!H.done,myDeal=!live&&my>=0&&S.dealer==my&&S.dealDl>0,dealer=S.seats[S.dealer];
 const A=S.again,ans=A&&(A.yes[me]?'in':A.no[me]?'out':''),askMe=!!A&&A.who.includes(me)&&!ans;
 // a new game: 20 seconds to say if you're in
 const O=S.optin,oName=O&&(S.games.find(g=>g.id==O.game)||{}).name,oIn=O?O.who.length-Object.values(O.ans).filter(x=>x=='out').length:0,optAsk=!!O&&O.who.includes(me)&&!O.ans[me];
 const who=`<b>${esc(me)}</b> <button data-a="rename" style="padding:2px 8px;font-size:12px">change</button>`;
 let me_='';
 if(my<0)me_=`${who} <span class="m">Saved chips: ${pl?pl.chips:0}</span><div class="row">${S.pend[me]?`<small>Seat requested, waiting for host…${H&&!H.done?' You\'ll join the next game.':''}</small> <button data-a="unsit">Cancel</button>`:qi>=0?`<b>You're #${qi+1} in line</b> <small>You'll get the next open seat.</small> <button data-a="unsit">Leave the line</button>`:full?'<button class="g" data-a="seat">Join the waitlist</button> <small>All 12 seats are taken.</small>':'<button class="g" data-a="seat">Sit Down</button>'}</div>`;
 else if(S.bust[me])me_=`<b>${esc(me)}</b> · <b>You're out of chips</b><div class="row full"><button class="g" data-a="buy">Get more chips</button><button class="r" data-a="stand">Stand Up</button></div><small>Choose within <span data-cd="${S.bust[me]}"></span> or you'll stand up automatically.</small>`;
 else{me_=`${who} · ${pl.chips} chips`;
  if(inG){const al=H.lives[my]>0,mc=H.cards[my],pk=Date.now()<peekT,open=H.shown[my]||H.stage=='reveal';
   me_+=`<div class="lv big">${coins(H.lives[my])}</div>`;
   if(mc!=null)me_+=`<div class="row">${ch(open||pk?mc:null,'lg')}${open?'':pk?'<button data-a="hide">🙈 Hide now</button>':'<button data-a="peek">👁 Peek 3s</button>'}${al&&H.stage=='play'&&mc%13==12&&!H.shown[my]?'<button class="g" data-a="showace">Show my Ace</button>':''}</div>`;
   if((H.notes||[]).length)me_+=`<div class="trades">${H.notes.map(x=>`<div>🔁 ${tradeText(x)}</div>`).join('')}</div>`;
   if(!H.done&&al&&H.stage=='play'&&H.turn==my){
    // an Ace in your hand, or one showing on your left, means there's nothing to swap
    const myAce=mc%13==12,nbAce=H.nb>=0&&H.shown[H.nb];
    me_+=`<div class="row"><b>Your turn</b> <span class="clock" data-cd="${H.dl||0}"></span></div>`;

 else if(a=='forget'){if(arm=='f:'+v){arm='';send({t:'admin',op:'forget',name:v})}else{arm='f:'+v;renderAdmin()}}
 else if(a=='share'){const ok=await copy(LINK);b.textContent=ok?'✓ Copied':'Copy failed';if(!ok)note('Copy this link: '+LINK);setTimeout(()=>b.textContent='🔗 Share',1500)}
 else if(a=='snd'){snd=snd=='all'?'vib':snd=='vib'?'off':'all';try{localStorage.setItem('pn_snd',snd)}catch(x){}skin();if(snd=='all')play('turn');else if(snd=='vib')buzz(200)}
 else if(a=='th'){theme=isDark()?'light':'dark';try{localStorage.setItem('pn_theme',theme)}catch(x){}skin()}
 else if(a=='dtog'){const k=+v;dsel=dsel.includes(k)?dsel.filter(x=>x!=k):dsel.concat(k);render()}
 else if(a=='drawgo'){send({t:'act',a:'draw',idx:dsel});dsel=[]}
 else if(a=='seat')send({t:'sit'});
 else if(a=='unsit')send({t:'unsit'});
 else if(a=='stand')send({t:'stand'});
 else if(a=='buy')send({t:'buy'});
 else if(a=='fold'||a=='call')send({t:'act',a});
 else if(a=='raise'){rt=rtSnap($('#rt').value);send({t:'act',a:'raise',amt:rt})}
 else if(a=='allin')send({t:'act',a:'raise',amt:1e9});
 else if(a=='q'){rt=+v;render()}
 else if(a=='peek'){peekT=Date.now()+3000;render();setTimeout(render,3050)}
 else if(a=='hide'){peekT=0;render()}
 else if(!host)return;
 else if(a=='start')hs('start');
 else if(a=='pause')hs('pause',{on:S.hold!='host'});
 else if(a=='cancelgame'){if(arm=='cancel'){arm='';hs('cancel')}else{arm='cancel';renderHost()}}
 else if(a=='ok'){hs('seat',{name:v,add:addAmt[v]});delete addAmt[v]}
 else if(a=='no')hs('noseat',{name:v});
 else if(a=='give'){hs('give',{name:v,add:addAmt[v]??1000});delete addAmt[v]}
 else if(a=='nobuy')hs('nobuy',{name:v});
 else if(a=='bot')hs('bot');
 else if(a=='rmbot')hs('rmbot',{name:v});
 else if(a=='kick')hs('kick',{name:v});
 else if(a=='adj'){adjFor=v;render();const i=$('[data-adjin]');i&&i.focus()}
 else if(a=='adjok'){const x=$('[data-adjin]').value;adjFor='';hs('adj',{name:v,x});render()}});
document.addEventListener('focusout',e=>{const t=e.target;if(t.id=='dbb'){setBB(t.value);setTimeout(render,300)}if(t.id=='dan'){setAnte(t.value);setTimeout(render,300)}if(t.id=='bta'&&S&&S.hand){setBet(t.value,S.hand.pot);setTimeout(render,300)}if(t.id=='rt'){rt=rtSnap(t.value);t.value=rt}});
document.addEventListener('keydown',e=>{if(e.key!='Enter')return;if(e.target.id=='nm')$('[data-a=name]').click();if(e.target.id=='ak')$('[data-a=unlock]').click()});
document.addEventListener('change',e=>{if(e.target.id=='dwl')dwl=+e.target.value});
