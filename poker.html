<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Poker Night</title>
<style>
:root{--bg:#f3efe6;--fg:#1d1d1b;--pn:#fff;--bd:#0003;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--fg:#eee;--pn:#1c2420;--bd:#fff3}}
:root[data-theme="dark"]{--bg:#101613;--fg:#eee;--pn:#1c2420;--bd:#fff3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;padding:8px;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
button,input{font:inherit;border-radius:8px;border:1px solid var(--bd);padding:8px 12px;background:var(--pn);color:var(--fg)}
button{cursor:pointer;font-weight:600}input{width:90px}
.p{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tbl{position:relative;width:100%;aspect-ratio:4/5;background:radial-gradient(#1b8f50,#0a5430);border:8px solid #5b3a1e;border-radius:50%;margin-top:8px;color:#fff}
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:60%}
.c{display:inline-block;width:34px;height:48px;margin:1px;border-radius:5px;background:#fff;color:#111;font:700 13px/48px system-ui;font-style:normal;text-align:center;box-shadow:0 1px 3px #0008}
.c.red{color:#c0262d}.c.b{background:repeating-linear-gradient(45deg,#1e4f9c,#1e4f9c 4px,#2b66c4 4px,#2b66c4 8px);border:2px solid #fff}
.c.e{background:#0003;box-shadow:none;border:1px dashed #fff6}.c.lg{width:54px;height:76px;font-size:20px;line-height:76px}.c.sm{width:18px;height:25px;font-size:8px;line-height:25px;margin:0}
.st{position:absolute;transform:translate(-50%,-50%);width:74px;text-align:center;font-size:11px;background:#000a;border-radius:10px;padding:3px 2px;line-height:1.25}
.st.t{box-shadow:0 0 0 3px gold}.st.f{opacity:.45}.st.me{outline:2px solid #6cf}.st.e{background:#0003;border:1px dashed #fff8;cursor:pointer;padding:12px 2px}
.ch{display:inline-block;width:13px;height:13px;border-radius:50%;border:3px dashed #fff;background:#c0392b;vertical-align:middle;margin-right:2px}
.d{display:inline-block;background:#fff;color:#000;border-radius:50%;width:15px;height:15px;font-size:10px;line-height:15px;font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}.g{background:#0b6b3a;color:#fff;border-color:#0b6b3a}.r{background:#b3261e;color:#fff;border-color:#b3261e}
small,.m{opacity:.7}h4{margin:8px 0 2px}
</style></head><body>
<div class="top"><b>🃏 Poker Night</b><span><button id="sh" data-a="share">🔗 Share</button> <button id="snd" data-a="snd">🔊</button></span></div>
<div id="note" class="p" hidden></div><div id="main"></div><div id="host"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),SU='♠♥♦♣',RK='  23456789TJQKA',HN=['High card','Pair','Two pair','Trips','Straight','Flush','Full house','Quads','Straight flush'];
const GAMES={holdem:{name:"Texas Hold'em",hole:2}};
let db,ref,host=false,S=null,me='',rt=0,peekT=0,snd=true,AC,lastN=-1,addAmt={},busy=0,q=[],adjFor='',leaveArm=0,noteT,saving=0,dirty=0;
// alert/confirm/prompt are blocked in the artifact iframe, so messages show inline
function note(t){const e=$('#note');e.textContent=t;e.hidden=!t;clearTimeout(noteT);if(t)noteT=setTimeout(()=>e.hidden=true,4000)}
// replace markup only when it changed, so a click isn't lost to a node swapped out mid-tap
const put=(e,h)=>{if(e._h!==h){e._h=h;e.innerHTML=h}};
try{me=localStorage.getItem('pn_name')||''}catch(e){}
const cs=c=>RK[2+c%13].replace('T','10')+SU[c/13|0];
const ch=(c,x='')=>c==null?`<i class="c b ${x}"></i>`:`<i class="c ${[1,2].includes(c/13|0)?'red':''} ${x}">${cs(c)}</i>`;
const beep=(f,d=.15,t=0)=>{if(!snd)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}catch(e){}};
const fresh=()=>({players:{},seats:Array(12).fill(''),pend:{},leave:{},hand:0,btn:-1,sb:5,bb:10,game:'holdem',n:0,last:-1});
const LINK='https://claude.ai/artifact/1meboYwVpj812xwNQkQPCe';
const freeSeat=()=>{for(let k=1;k<=12;k++){const i=((S.last??-1)+k+12)%12;if(!S.seats[i])return i}return -1};
async function copy(t){try{await navigator.clipboard.writeText(t);return 1}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();let ok=0;try{ok=document.execCommand('copy')}catch(e){}x.remove();return ok}}
let bt;function botTick(){clearTimeout(bt);const H=S&&S.hand;if(!host||!H||H.done)return;const n=S.seats[H.turn];if(!S.players[n]||!S.players[n].bot)return;const v=S.n;
 bt=setTimeout(()=>{if(S.n!==v)return;const need=H.cur-H.bet[H.turn],p=S.players[n],o=need>0?['fold','call','raise']:['call','raise'],a=o[Math.random()*o.length|0];act(n,a,H.cur+H.minR*(1+(Math.random()*4|0))+(Math.random()<.1?p.chips:0));save()},1300)}
// ---------- engine (runs in host's browser) ----------
function s5(c){const r=c.map(x=>2+x%13).sort((a,b)=>b-a),f=c.every(x=>(x/13|0)==(c[0]/13|0)),m={};r.forEach(x=>m[x]=(m[x]||0)+1);
const g=Object.keys(m).map(Number).sort((a,b)=>m[b]-m[a]||b-a),u=[...new Set(r)];let st=0;
if(u.length==5){if(u[0]-u[4]==4)st=u[0];else if(u[0]==14&&u[1]==5)st=5}
const k=g.map(x=>m[x]).join(''),cat=st&&f?8:k=='41'?7:k=='32'?6:f?5:st?4:k=='311'?3:k=='221'?2:k=='2111'?1:0,t=st?[st]:g;while(t.length<5)t.push(0);
return t.reduce((a,x)=>a*15+x,cat)}
function best(c){let m=0;const n=c.length;(function f(s,a){if(a.length==5){m=Math.max(m,s5(a));return}for(let i=s;i<n;i++)f(i+1,[...a,c[i]])})(0,[]);return m}
function nxt(f){const H=S.hand,L=H.ps.length,o=H.ps.indexOf(f);for(let k=1;k<=L;k++){const s=H.ps[(o+k)%L];if(!H.fold[s]&&!H.allin[s])return s}return -1}
function post(i,a){const H=S.hand,p=S.players[S.seats[i]];a=Math.max(0,Math.min(a,p.chips));p.chips-=a;H.bet[i]+=a;H.tot[i]+=a;if(p.chips==0)H.allin[i]=1}
function startHand(){
 const g=GAMES[S.game];let nb=-1;for(let k=1;k<=12;k++){const i=(S.btn+k+12)%12,n=S.seats[i];if(n&&S.players[n].chips>0){nb=i;break}}
 const ps=[];for(let k=1;k<=12;k++){const i=(nb+k)%12,n=S.seats[i];if(n&&S.players[n].chips>0)ps.push(i)}
 if(ps.length<2){note('Need at least 2 seated players with chips');return}
 S.btn=nb;const d=[...Array(52).keys()];for(let i=51;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 const h={},bet={},tot={};ps.forEach(i=>{h[i]=Array.from({length:g.hole},()=>d.pop());bet[i]=0;tot[i]=0});
 const H=S.hand={ps,btn:nb,d,board:[],h,bet,tot,fold:{},allin:{},acted:{},stage:0,cur:S.bb,minR:S.bb,turn:-1,done:0,show:0,msg:'New hand'};
 const hu=ps.length==2,sb=hu?ps[1]:ps[0],bb=hu?ps[0]:ps[1],first=hu?ps[1]:ps[2];
 post(sb,S.sb);post(bb,S.bb);H.turn=H.allin[first]?nxt(first):first;save()}
function finish(live){const H=S.hand,n=S.seats[live[0]],pot=Object.values(H.tot).reduce((a,b)=>a+b,0);S.players[n].chips+=pot;H.msg=n+' wins '+pot;H.done=1}
function showdown(live){const H=S.hand,sc={};live.forEach(i=>sc[i]=best(H.h[i].concat(H.board)));
 const lv=[...new Set(live.map(i=>H.tot[i]))].sort((a,b)=>a-b),win={};let pv=0;
 lv.forEach(L=>{let pot=0;H.ps.forEach(i=>pot+=Math.min(H.tot[i],L)-Math.min(H.tot[i],pv));pv=L;
  const el=live.filter(i=>H.tot[i]>=L),mx=Math.max(...el.map(i=>sc[i])),w=el.filter(i=>sc[i]==mx),sh=Math.floor(pot/w.length);
  w.forEach((i,k)=>{const n=S.seats[i],g=sh+(k?0:pot-sh*w.length);S.players[n].chips+=g;win[n]=(win[n]||0)+g})});
 H.msg=Object.keys(win).map(n=>n+' wins '+win[n]+' ('+HN[Math.floor(sc[S.seats.indexOf(n)]/15**5)]+')').join(', ');H.show=1;H.done=1}
function adv(){const H=S.hand,live=H.ps.filter(i=>!H.fold[i]);if(live.length==1)return finish(live);
 const can=live.filter(i=>!H.allin[i]);
 if(!can.every(i=>H.acted[i]&&H.bet[i]==H.cur)){H.turn=nxt(H.turn);return}
 while(true){if(H.stage==3)return showdown(live);H.stage++;for(let k=H.stage==1?3:1;k>0;k--)H.board.push(H.d.pop());
  H.ps.forEach(i=>H.bet[i]=0);H.cur=0;H.acted={};H.minR=S.bb;if(can.length>1){H.turn=nxt(H.ps[H.ps.length-1]);return}}}
function act(n,a,amt){const H=S.hand;if(!H||H.done)return;const t=H.turn;if(S.seats[t]!==n)return;
 const p=S.players[n],b=H.bet[t],need=H.cur-b;
 if(a=='fold'){H.fold[t]=1;H.msg=n+' folds'}
 else{let to=a=='raise'?Math.floor(+amt)||0:0;const mx=b+p.chips;to=Math.min(to,mx);
  if(a!='raise'||to<=H.cur){post(t,need);H.msg=n+(need>0?' calls '+Math.min(need,b+p.chips):' checks')}
  else{if(to<H.cur+H.minR&&to<mx)to=Math.min(H.cur+H.minR,mx);if(to-H.cur>=H.minR)H.minR=to-H.cur;H.cur=to;H.acted={};post(t,to-b);H.msg=n+(H.allin[t]?' is all-in ':' raises to ')+to}}
 H.acted[t]=1;adv()}
async function handle(r){const n=r.name,t=r.type;if(!n)return;
 if(t=='sit'&&!S.seats.includes(n)){S.players[n]=S.players[n]||{chips:0};S.pend[n]=1}
 else if(t=='leave'&&S.seats.includes(n))S.leave[n]=1;else if(t=='act')act(n,r.a,r.amt)}
async function drain(){if(busy)return;busy=1;while(q.length){const d=q.shift();try{await handle(d.data());await db.doc('req/'+d.id).delete()}catch(e){}}busy=0;save()}
async function save(){S.n=(S.n||0)+1;try{render()}catch(e){console.error(e)}botTick();dirty=1;if(saving)return;saving=1;
 while(dirty){dirty=0;try{await ref.set(S)}catch(e){console.error(e);note('Could not save the table: '+(e.code||e.message||e))}}saving=0}
const send=o=>db.doc('req/'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)).set({name:me,t:Date.now(),...o}).catch(e=>note('Could not send: you may need Contributor access'));
// ---------- UI ----------
function render(){const m=$('#main');
 if(!db){put(m,'<div class="p">This table needs the shared-state feature, which is unavailable in this view. Make sure you are signed in via the invite link.</div>');return}
 if(!me){put(m,'<div class="p"><b>Your name</b><div class="row"><input id="nm" maxlength="12" placeholder="Name" style="width:150px"><button class="g" data-a="name">Join</button></div></div>');return renderHost()}
 if(!S){put(m,'<div class="p">Waiting for the host to open the table…</div>');return renderHost()}
 const H=S.hand,my=S.seats.indexOf(me),inH=H&&H.ps.includes(my)&&!H.fold[my],pl=S.players[me],pot=H?Object.values(H.tot).reduce((a,b)=>a+b,0):0;
 const occ=S.seats.map((n,i)=>n?i:-1).filter(i=>i>=0),N=Math.max(occ.length,1),mr=Math.max(0,occ.indexOf(my));
 let seats='';for(let r=0;r<occ.length;r++){const i=occ[r],a=(r-mr)*2*Math.PI/N,x=50-42*Math.sin(a),y=50+40*Math.cos(a),n=S.seats[i];
  const ih=H&&H.ps.includes(i),fo=ih&&H.fold[i];
  const cards=ih&&!fo?H.h[i].map(c=>ch(H.show||(i==my&&0)?c:null,'sm')).join(''):'';
  seats+=`<div class="st ${H&&!H.done&&H.turn==i?'t':''} ${fo?'f':''} ${i==my?'me':''}" style="left:${x}%;top:${y}%">${H&&H.btn==i?'<span class="d">D</span> ':''}<b>${n}</b><br>${S.players[n].chips}<br>${cards}${ih&&H.bet[i]?`<br><i class="ch"></i>${H.bet[i]}`:''}</div>`}
 const board=H?[0,1,2,3,4].map(k=>H.board[k]!=null?ch(H.board[k]):'<i class="c e"></i>').join(''):'';
 let me_='';
 if(my<0)me_=`<b>${me}</b> <span class="m">Saved chips: ${pl?pl.chips:0}</span><div class="row">${S.pend[me]?'<small>Seat requested, waiting for host…</small>':'<button class="g" data-a="seat">Request a seat</button>'}</div>`;
 else{me_=`<b>${me}</b> · ${pl.chips} chips`;
  if(inH){const pk=Date.now()<peekT;me_+=`<div class="row">${H.h[my].map(c=>ch(pk?c:null,'lg')).join('')}<button data-a="peek">👁 Peek 3s</button></div>`;
   if(!H.done&&H.turn==my){const need=H.cur-H.bet[my],mn=Math.min(H.cur+H.minR,H.bet[my]+pl.chips);if(!rt||rt<mn||rt>H.bet[my]+pl.chips)rt=mn;
    me_+=`<div class="row"><button class="r" data-a="fold">Fold</button><button class="g" data-a="call">${need>0?'Call '+Math.min(need,pl.chips):'Check'}</button><button data-a="allin">All-in</button></div>`;
    if(pl.chips>need)me_+=`<div class="row"><input id="rt" type="number" inputmode="numeric" value="${rt}"><button class="g" data-a="raise">${H.cur?'Raise to':'Bet'}</button><button data-a="q" data-v="${mn}">Min</button><button data-a="q" data-v="${H.cur+Math.floor(pot/2)}">½ Pot</button><button data-a="q" data-v="${H.cur+pot}">Pot</button></div>`}
   else if(!H.done)me_+=`<div class="m">Waiting for ${S.seats[H.turn]}…</div>`}
  else if(H&&!H.done)me_+=`<div class="m">You're sitting out this hand.</div>`;
  me_+=`<div class="row">${S.leave[me]?'<small>Leave requested…</small>':leaveArm?'<button class="r" data-a="leave">Tap again to ask the host to cash you out</button><button data-a="leavex">Cancel</button>':'<button data-a="leave">Request to leave</button>'}</div>`}
 put(m,`<div class="tbl" style="aspect-ratio:${N<=3?'1/1':N<=7?'6/7':'4/5'}">${seats}<div class="mid"><div>${board}</div><div style="margin:4px 0"><i class="ch"></i><b>Pot ${pot}</b></div><div style="font-size:12px">${H?H.msg:'Waiting for host to deal'}</div></div></div><div class="p">${me_}</div>`);
 if(H&&!H.done&&H.turn==my&&lastN!=S.n){rt=0;beep(660,.12);beep(880,.2,.15);navigator.vibrate&&navigator.vibrate(200)}
 if(H&&H.done&&lastN!=S.n){[523,659,784].forEach((f,i)=>beep(f,.15,i*.12))}
 lastN=S.n;renderHost()}
function renderHost(){const e=$('#host'),f=document.activeElement;if(!host||!S||(f&&f.tagName=='INPUT'&&e.contains(f)))return;const H=S.hand;
 const pend=Object.keys(S.pend).map(n=>{const v=addAmt[n]??(S.players[n].chips>0?0:1000);return`<div class="row"><b>${n}</b><span class="m">saved ${S.players[n].chips}</span> +<input data-add="${n}" type="number" value="${v}"><button class="g" data-a="ok" data-v="${n}">Seat</button><button data-a="no" data-v="${n}">✕</button></div>`}).join('');
 const lv=Object.keys(S.leave).map(n=>`<div class="row"><b>${n}</b> wants to leave (${S.players[n].chips} chips) <button class="g" data-a="lok" data-v="${n}">Approve</button><button data-a="lno" data-v="${n}">✕</button></div>`).join('');
 const led=Object.keys(S.players).map(n=>`<div class="row"><span style="flex:1">${n} ${S.seats.includes(n)?'':'<small>(away)</small>'}</span><b>${S.players[n].chips}</b>${adjFor==n?`<input data-adjin="${n}" type="number" placeholder="±" style="width:80px"><button class="g" data-a="adjok" data-v="${n}">OK</button>`:`<button data-a="adj" data-v="${n}">±</button>`}${S.players[n].bot?`<button data-a="rmbot" data-v="${n}">✕</button>`:''}</div>`).join('');
 put(e,`<div class="p"><b>Host controls</b> <small>${GAMES[S.game].name}</small><div class="row"><button class="g" data-a="start" ${H&&!H.done?'disabled':''}>${H&&!H.done?'Hand in progress':'Deal next hand'}</button><button data-a="bot">+ Bot</button>Blinds <input data-bl="sb" type="number" value="${S.sb}" style="width:60px"> / <input data-bl="bb" type="number" value="${S.bb}" style="width:60px"></div>
 ${pend?'<h4>Seat requests</h4>'+pend:''}${lv?'<h4>Leave requests</h4>'+lv:''}<h4>Chip ledger</h4>${led||'<small>No players yet</small>'}</div>`)}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 try{AC=AC||new AudioContext();AC.resume()}catch(x){}
 if(a=='name'){const n=$('#nm').value.trim().replace(/[.\/\\]/g,'').slice(0,12);if(!n)return;me=n;try{localStorage.setItem('pn_name',n)}catch(x){}render()}
 else if(a=='share'){const ok=await copy('Join my poker table 🃏 '+LINK);b.textContent=ok?'✓ Copied':'Copy failed';if(!ok)note('Copy this link: '+LINK);setTimeout(()=>b.textContent='🔗 Share',1500)}
 else if(a=='snd'){snd=!snd;b.textContent=snd?'🔊':'🔈'}
 else if(a=='seat'){if(S.seats.includes(me)||S.pend[me])return;send({type:'sit'})}
 else if(a=='fold'||a=='call')send({type:'act',a});
 else if(a=='raise')send({type:'act',a:'raise',amt:rt});
 else if(a=='allin')send({type:'act',a:'raise',amt:1e9});
 else if(a=='q'){rt=+v;render()}
 else if(a=='peek'){peekT=Date.now()+3000;render();setTimeout(render,3050)}
 else if(a=='leave'){if(leaveArm){leaveArm=0;send({type:'leave'})}else leaveArm=1;render()}
 else if(a=='leavex'){leaveArm=0;render()}
 else if(!host)return;
 else if(a=='start')startHand();
 else if(a=='ok'){const p=S.players[v],add=+addAmt[v]||(p.chips>0?0:1000),s=freeSeat();
  if(s<0)return note('Table is full');if(p.chips+add<=0)return note('Give them some chips first');p.chips+=add;S.seats[s]=v;S.last=s;delete S.pend[v];delete addAmt[v];save()}
 else if(a=='no'){delete S.pend[v];save()}
 else if(a=='lok'){if(S.hand&&!S.hand.done&&S.hand.ps.includes(S.seats.indexOf(v))&&!S.hand.fold[S.seats.indexOf(v)])return note('Wait until this hand ends');S.seats[S.seats.indexOf(v)]='';delete S.leave[v];save()}
 else if(a=='lno'){delete S.leave[v];save()}
 else if(a=='bot'){const s=freeSeat();if(s<0)return note('Table is full');let k=1;while(S.players['Bot '+k])k++;const n='Bot '+k;S.players[n]={chips:1000,bot:1};S.seats[s]=n;S.last=s;save()}
 else if(a=='rmbot'){const H=S.hand;if(H&&!H.done)return note('Wait until this hand ends');const i=S.seats.indexOf(v);if(i>=0)S.seats[i]='';delete S.players[v];save()}
 else if(a=='adj'){adjFor=v;render();const i=$('[data-adjin]');i&&i.focus()}
 else if(a=='adjok'){const x=Math.floor(+$('[data-adjin]').value)||0;adjFor='';if(x){S.players[v].chips=Math.max(0,S.players[v].chips+x);save()}else render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='rt')rt=+t.value;if(t.dataset.add)addAmt[t.dataset.add]=t.value});
document.addEventListener('change',e=>{const t=e.target;if(host&&t.dataset.bl){S[t.dataset.bl]=Math.max(1,+t.value||1);save()}});
(async()=>{render();try{db=await claude.use('db');const u=await claude.use('user');host=u?!!(await u.isOwner()):false}catch(e){}
 if(!db)return render();ref=db.doc('game/state');
 ref.onSnapshot(s=>{if(host&&S)return;if(host&&!s.exists&&s.metadata&&s.metadata.fromCache)return;
  S=s.exists?(host?structuredClone(s.data()):s.data()):null;if(host&&!S){S=fresh();save()}else render();botTick()},e=>{console.error(e);note('Lost connection to the table: '+(e.code||e.message))});
 db.collection('req').onSnapshot(s=>{if(!host)return;s.docChanges().forEach(c=>{if(c.type=='added')q.push(c.doc)});drain()});render()})();
</script></body></html>
